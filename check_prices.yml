name: Check Packout/Milwaukee Prices

on:
  schedule:
    # Runs once a day at 13:00 UTC (~9am Eastern). Adjust as you like -
    # cron syntax is minute hour day month weekday.
    - cron: "0 13 * * *"
  workflow_dispatch: {}  # lets you also trigger it manually from the Actions tab

jobs:
  check-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run price check
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_NAME: ${{ secrets.SHEET_NAME }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
        run: python main.py
